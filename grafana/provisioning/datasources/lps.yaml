apiVersion: 1
datasources:
  - name: LPS InfluxDB
    uid: lps-influxdb
    type: influxdb
    access: proxy
    url: http://influxdb:8086
    isDefault: true
    editable: false
    jsonData:
      version: Flux
      organization: LPS
      defaultBucket: LPS_Metrics
    secureJsonData:
      token: $LPS_INFLUX_READ_TOKEN